  h.g.position.set(h.p.x+h.v.x*tt*.5,Math.max(fl,h.p.y+h.v.y*tt-4.5*tt*tt),h.p.z+h.v.z*tt*.5);h.g.rotation.set(h.sp.x*tt,h.ry+h.sp.y*tt,h.sp.z*tt)}}
 return bb}
function fx(dt,bb){
 // ambient
 sacc+=dt*14;while(sacc>=1){sacc--;spark.e(-18+rnd()*38,.3,rnd()*8,(rnd()-.5)*.6,1+rnd(),0,3,[1,.7,.2],0)}
 once('t1',1.1,()=>burst(-8,11,-4,110,8,2.2));once('t2',2.2,()=>burst(10,12,-4,110,8,2.2));once('t3',3.2,()=>burst(1,13,-6,140,9,2.4));
 // arrow flame
 if(T>=TL&&arrow.visible&&T<T3){const th=arrow.rotation.z,tx=arrow.position.x+Math.cos(th)*2.7,ty=arrow.position.y+Math.sin(th)*2.7;
  for(let i=0;i<5;i++)fire.e(tx,ty,.35,(rnd()-.5)*.6,rnd()*1.2,(rnd()-.5)*.4,.45,rc(FC));
  if(T>=T2)for(let i=0;i<3;i++)spark.e(tx,ty,.35,(rnd()-.5)*2,(rnd()-.5)*2,(rnd()-.5),.7,[1,.6,.2],0);
  arrL.position.set(tx,ty,1);arrL.intensity=2+rnd()}else arrL.intensity=0;
 once('imp',T3,()=>{const x=6.7,y=6.3;for(let i=0;i<160;i++){const u=rnd()*2-1,a=rnd()*6.28,s=Math.sqrt(1-u*u),v=2+rnd()*7;fire.e(x,y,.3,s*Math.cos(a)*v,u*v,s*Math.sin(a)*v,.5+rnd()*.7,rc(FC))}burst(x,y,.3,260,9,1.4,[1,.8,.35]);flash=1;shake=1});
 flash=Math.max(0,flash-dt*2.5);flashL.intensity=flash*10;shake=Math.max(0,shake-dt*.8);
 const amt=T<T3?0:(T<TF?cl((T-T3)/1.5):cl(1-(T-TF)/4));
 if(amt>0){acc+=amt*340*dt;const hh=2+bb*10*(T<TC?1:body.scale.y);
  while(acc>=1){acc--;const y=.8+rnd()*hh,sp=2.6*(1-y/15)+.5;fire.e(8+(rnd()-.5)*2*sp,y,(rnd()-.5)*2.4,(rnd()-.5)*.8,1.5+rnd()*3,(rnd()-.5)*.8,.6+rnd()*.9,rc(FC))}
  sacc+=0;const ns=amt*45*dt;if(rnd()<ns)spark.e(8+(rnd()-.5)*4,2+rnd()*hh,(rnd()-.5)*2,(rnd()-.5)*3,2+rnd()*4,(rnd()-.5)*3,1.2+rnd()*1.5,[1,.7,.3],-2)}
 fireL.intensity=amt*(2.8+rnd()*1.2)+(amt>0?0:0);
 if(T>T3+1&&T<TC){crk-=dt;if(crk<=0){crk=.18+rnd()*.25;burst(8+(rnd()-.5)*5,2+rnd()*hh0(),(rnd()-.5)*2,36,4.5,.9)}}
 once('hd',TC,()=>{shake=.6;burst(8,6,0,200,8,1.6,[1,.6,.2])});
 if(T>TF){fw-=dt;if(fw<=0){fw=.4+rnd()*.3;burst(-12+rnd()*26,8+rnd()*5,-4+rnd()*3,150,9,2.1)}}
 diyas.forEach((d,i)=>{const s=.9+.25*Math.sin(T*11+i*1.7);d.scale.setScalar(d.isSprite?1.3*s:s)});
 fire.u(dt);spark.u(dt)}

 if(T<4.3)cap('a','');else if(T<T1)cap('b','श्री राम धनुष-बाण लेकर पधारे…<br>Shri Ram arrives with Dhanush &amp; Teer');
 else if(T<T2)cap('c','धर्म का बाण तैयार…<br>The arrow of Dharma is drawn');else if(T<T3)cap('d','<b>जय श्री राम!</b>');
 else if(T<TF)cap('e','रावण दहन<br>Ravan Dahan – evil burns to ashes');
 else cap('f','<b>Jai Shri Ram</b>Good has triumphed over evil.<br><button id="re">↻ Replay</button>')}

 const z=camZ-4*(1-sm(cl(T/6)))+(T>T3?1.2*sm(cl((T-T3)/4)):0);
 cam.position.set(1.5+Math.sin(T*.2)*1.2+(rnd()-.5)*shake*.5,5.2+(rnd()-.5)*shake*.5,z);cam.lookAt(1.5,5.6,0);
